<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bike Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#14171A;
  --panel:#1C2024;
  --panel-raised:#22262B;
  --amber:#F2A93C;
  --green:#6FCF97;
  --red:#E4572E;
  --text:#EDEDED;
  --muted:#8B9199;
  --border:#2C3136;
}

*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:24px 16px 80px;
  min-height:100vh;
}
.wrap{max-width:720px; margin:0 auto;}

header{margin-bottom:24px;}
header h1{
  font-size:22px; font-weight:700; letter-spacing:-0.02em;
  display:flex; align-items:center; gap:8px;
}
header p{color:var(--muted); font-size:13px; margin-top:4px;}

.odo-row{display:flex; justify-content:center; gap:4px; margin:18px 0 6px;}
.odo-digit{
  background:#0E1013;
  border:1px solid var(--border);
  border-radius:4px;
  width:34px; height:48px;
  display:flex; align-items:center; justify-content:center;
  font-family:'DM Mono', monospace;
  font-size:26px; font-weight:500;
  color:var(--amber);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 0 8px rgba(242,169,60,0.15);
}
.odo-label{text-align:center; color:var(--muted); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}

.cluster{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 16px;
  margin-bottom:14px;
}

.stat-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin-bottom:10px;
}
.stat-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 12px;
}
.stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
.stat-card .value{font-family:'DM Mono',monospace; font-size:20px; font-weight:500;}
.stat-card .sub{font-size:11px; color:var(--muted); margin-top:2px;}
.stat-card.money .value{color:var(--green);}

.service-bar{height:8px; background:#0E1013; border-radius:4px; overflow:hidden; margin-top:8px; border:1px solid var(--border);}
.service-fill{height:100%; background:linear-gradient(90deg, var(--green), var(--amber)); transition:width .3s;}

.tabs{display:flex; gap:6px; margin:20px 0 14px; overflow-x:auto; padding-bottom:2px;}
.tab{
  background:var(--panel); border:1px solid var(--border); color:var(--muted);
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:all .15s; flex-shrink:0;
}
.tab.active{background:var(--amber); color:#14171A; border-color:var(--amber);}

.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:18px; margin-bottom:14px;
}
.panel h2{font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:6px;}

.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
.field input, .field select{
  background:#0E1013; border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; color:var(--text); font-size:14px; font-family:'DM Mono',monospace;
}
.field select{font-family:'Inter',sans-serif;}
.field input:focus, .field select:focus{outline:none; border-color:var(--amber);}

.btn{
  background:var(--amber); color:#14171A; border:none; border-radius:8px;
  padding:11px 16px; font-weight:700; font-size:14px; cursor:pointer;
  width:100%; margin-top:4px;
}
.btn:active{transform:scale(0.98);}
.btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn.danger{background:transparent; border:1px solid var(--red); color:var(--red);}

.hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
.hint.warn{color:var(--amber);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border);}
td{padding:8px; border-bottom:1px solid var(--border); font-family:'DM Mono',monospace;}
tr:last-child td{border-bottom:none;}
.icon-btn{
  background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px;
  padding:4px 8px; cursor:pointer; font-size:12px;
}
.icon-btn:hover{border-color:var(--amber); color:var(--amber);}

.empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}
.gap-flag{color:var(--red); font-size:11px; margin-top:2px;}

.loading{text-align:center; color:var(--muted); padding:40px; font-size:13px;}
.footer-note{text-align:center; color:var(--muted); font-size:11px; margin-top:20px;}
.export-row{display:flex; gap:10px; flex-direction:column;}
.export-row .btn{margin-top:0;}

.bar-row{margin-bottom:12px;}
.bar-row .bar-head{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
.bar-head .cat{color:var(--text); font-weight:600;}
.bar-head .amt{font-family:'DM Mono',monospace; color:var(--muted);}
.bar-track{height:10px; background:#0E1013; border:1px solid var(--border); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; background:var(--amber); border-radius:5px;}
.bar-fill.fuel{background:var(--amber);}
.bar-fill.service{background:var(--green);}
.bar-fill.other{background:#7EA6E0;}

.big-stat{text-align:center; padding:10px 0;}
.big-stat .value{font-family:'DM Mono',monospace; font-size:32px; font-weight:500; color:var(--green);}
.big-stat .label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}

.chart-box{position:relative; height:200px; margin-top:6px;}
.chart-box.tall{height:240px;}
.legend-note{font-size:11px; color:var(--muted); text-align:center; margin-top:6px;}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<body>
<div id="conn-warning" style="display:none; background:#3A1F1F; border:1px solid var(--red); color:#F2A9A0; font-size:12px; padding:10px 16px; text-align:center;">
  ⚠️ Can't reach the server right now — changes won't save until this is back. Your data is safe, this page just isn't connected.
</div>
<div class="wrap" id="app">
  <div class="loading">Booting up the dashboard…</div>
</div>

<script>
const SHEET_SCHEMA_VERSION = 2;
let data = null;
let activeTab = 'dashboard';

function sheetImportData(){
  return {
    entries: {
      "2026-08-01":{morning:13704, evening:13714},
      "2026-08-02":{morning:13714, evening:13774},
      "2026-08-03":{morning:13774, evening:13860},
      "2026-08-04":{morning:13860, evening:14158, note:'Native trip'},
      "2026-08-05":{morning:14158, evening:14218},
      "2026-08-06":{morning:14218, evening:14306},
      "2026-08-07":{morning:14306, evening:14390},
      "2026-08-08":{morning:14390, evening:14425},
      "2026-08-09":{morning:14425, evening:14445},
      "2026-08-10":{morning:14445, evening:14532},
      "2026-08-11":{morning:14532, evening:14655},
      "2026-08-12":{morning:14655, evening:14747},
      "2026-08-13":{morning:14747, evening:null}
    },
    refills: [
      {id:'f1', date:'2026-07-30', odometer:13674, liters:4.00, cost:443.72, note:'Last fuel before tracking', fullTank:false},
      {id:'f2', date:'2026-08-04', odometer:13860, liters:5.10, cost:565.53, note:'Morning full tank — auto-cut + slight top-up; native trip', fullTank:true},
      {id:'f3', date:'2026-08-04', odometer:14073, liters:4.58, cost:510.00, note:'Evening full tank — return from native', fullTank:true},
      {id:'f4', date:'2026-08-07', odometer:14332, liters:4.00, cost:443.56, note:'Regular 4-litre refill', fullTank:false},
      {id:'f5', date:'2026-08-11', odometer:14557, liters:4.00, cost:443.67, note:'Normal partial refill', fullTank:false},
      {id:'f6', date:'2026-08-13', odometer:14747, liters:4.00, cost:443.56, note:'Normal partial refill', fullTank:false}
    ],
    services: [
      {id:'s1', date:'2026-07-31', odometer:13704, cost:2931, note:'Air filter change, O-ring, pad set, rear brake shoe set, ECSTAR SYN 10W-30 engine oil — pre-tracking service'}
    ],
    settings: {intervalKm:2000}
  };
}

const EXPENSE_CATEGORIES = ['Insurance','Repair','Accessories','Tires/Puncture','Cleaning','Fine/Challan','Parts','Other'];
let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

const fmt = n => Number(n||0).toLocaleString('en-IN');
const fmtMoney = n => '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => new Date().toISOString().slice(0,10);
const dLabel = iso => {
  const [y,m,d] = iso.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d}-${months[parseInt(m)-1]}`;
};
const monthLabel = ym => {
  const [y,m] = ym.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${y}`;
};

function defaultData(){
  const base = sheetImportData();
  return {
    entries: base.entries,
    refills: base.refills,
    services: base.services,
    expenses: [],
    settings: base.settings,
    schemaVersion: SHEET_SCHEMA_VERSION
  };
}

function migrate(parsed){
  // upgrade old single-service shape to services[] + settings
  if(parsed.service && !parsed.services){
    parsed.services = [{
      id:'svc-legacy',
      date: Object.keys(parsed.entries||{}).sort()[0] || todayISO(),
      odometer: parsed.service.lastServiceOdo || 0,
      cost: 0,
      note:'Migrated from earlier version'
    }];
    parsed.settings = {intervalKm: parsed.service.intervalKm || 2000};
    delete parsed.service;
  }
  if(!parsed.services) parsed.services = [];
  if(!parsed.expenses) parsed.expenses = [];
  if(!parsed.settings) parsed.settings = {intervalKm:2000};
  if(!parsed.refills) parsed.refills = [];
  if(!parsed.entries) parsed.entries = {};

  parsed = applyBulkBatches(parsed);

  return parsed;
}

// Additive-only manual batch imports. RULES, learned the hard way:
// - NEVER overwrite an existing entries[date] — only fill in dates that are
//   completely missing.
// - NEVER add a refuel that already matches an existing one (same date+odo)
//   — prevents duplicates even if this somehow runs more than once.
// - Each batch is tracked by id in parsed.importedBatches so it only
//   applies once, but every check above is idempotent regardless.
function applyBulkBatches(parsed){
  parsed.importedBatches = parsed.importedBatches || [];

  const BATCH_ID = 'batch-14to21aug-2026';
  if(!parsed.importedBatches.includes(BATCH_ID)){
    const newRides = {
      "2026-08-14": {morning:14952, evening:15058},
      "2026-08-15": {morning:15058, evening:15104},
      "2026-08-16": {morning:15104, evening:15164},
      "2026-08-17": {morning:15164, evening:15283},
      "2026-08-18": {morning:15283, evening:15367},
      "2026-08-19": {morning:15367, evening:15452},
      "2026-08-20": {morning:15452, evening:15537},
      "2026-08-21": {morning:15537, evening:15618}
    };
    Object.keys(newRides).forEach(date=>{
      if(!parsed.entries[date]){
        parsed.entries[date] = newRides[date];
      }
    });

    const newRefuels = [
      {date:'2026-08-14', odometer:14973, liters:4.00, cost:443.56},
      {date:'2026-08-17', odometer:15195, liters:4.00, cost:443.56},
      {date:'2026-08-19', odometer:15411, liters:4.00, cost:443.56},
      {date:'2026-08-22', odometer:15619, liters:4.00, cost:443.56}
    ];
    newRefuels.forEach(r=>{
      const exists = parsed.refills.some(x=> x.date===r.date && x.odometer===r.odometer);
      if(!exists){
        parsed.refills.push({
          id:'batch'+Date.now()+Math.random().toString(36).slice(2,6),
          date:r.date, odometer:r.odometer, liters:r.liters, cost:r.cost
        });
      }
    });

    parsed.importedBatches.push(BATCH_ID);
  }

  return parsed;
}

async function loadData(){
  try{
    const res = await fetch('/api/data');
    if(!res.ok) throw new Error('bad response: '+res.status);
    const json = await res.json();
    if(json){
      data = migrate(json);
      await saveData();
    } else {
      data = defaultData();
      await saveData();
    }
  }catch(e){
    console.error('load failed', e);
    data = defaultData();
    const warn = document.getElementById('conn-warning');
    if(warn) warn.style.display = 'block';
  }
  render();
}

async function saveData(){
  try{
    const res = await fetch('/api/data', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error('save failed: '+res.status);
    const warn = document.getElementById('conn-warning');
    if(warn) warn.style.display = 'none';
  }catch(e){
    console.error('save failed', e);
    const warn = document.getElementById('conn-warning');
    if(warn) warn.style.display = 'block';
  }
}

function sortedDates(){
  return Object.keys(data.entries).sort();
}

function latestOdometer(){
  const dates = sortedDates();
  if(dates.length===0) return latestServiceOdo();
  const last = data.entries[dates[dates.length-1]];
  return last.evening ?? last.morning ?? 0;
}

function distanceForDate(iso){
  const e = data.entries[iso];
  if(!e || e.morning==null || e.evening==null) return null;
  return e.evening - e.morning;
}

function totalDistanceAll(){
  let total=0;
  sortedDates().forEach(d=>{ const dist=distanceForDate(d); if(dist!=null) total+=dist; });
  return total;
}

function monthStats(monthPrefix){
  const dates = sortedDates().filter(d=>d.startsWith(monthPrefix));
  let total=0, days=0;
  dates.forEach(d=>{
    const dist = distanceForDate(d);
    if(dist!=null){ total+=dist; days++; }
  });
  return {total, days, avg: days? total/days : 0};
}

function firstOfMonthISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`;
}

function rangeStats(from, to){
  const dates = sortedDates().filter(d=> d>=from && d<=to);
  let total=0, days=0;
  dates.forEach(d=>{
    const dist = distanceForDate(d);
    if(dist!=null){ total+=dist; days++; }
  });
  return {total, days, avg: days? total/days : 0};
}

function spendInRange(from, to){
  return totalSpend(allSpendRecords().filter(r=> r.date>=from && r.date<=to));
}

function litersInRange(from, to){
  return data.refills
    .filter(r=> r.date>=from && r.date<=to)
    .reduce((sum,r)=> sum + (Number(r.liters)||0), 0);
}

let rangeFrom = firstOfMonthISO();
let rangeTo = todayISO();

function updateRange(){
  const f = document.getElementById('range-from').value;
  const t = document.getElementById('range-to').value;
  if(f) rangeFrom = f;
  if(t) rangeTo = t;
  render();
}

function setRangePreset(preset){
  const today = todayISO();
  if(preset==='month'){
    rangeFrom = firstOfMonthISO(); rangeTo = today;
  } else if(preset==='7d'){
    const d = new Date(); d.setDate(d.getDate()-6);
    rangeFrom = d.toISOString().slice(0,10); rangeTo = today;
  } else if(preset==='30d'){
    const d = new Date(); d.setDate(d.getDate()-29);
    rangeFrom = d.toISOString().slice(0,10); rangeTo = today;
  } else if(preset==='all'){
    const dates = sortedDates();
    rangeFrom = dates[0] || today; rangeTo = today;
  }
  render();
}

function findGaps(){
  const dates = sortedDates();
  const gaps = [];
  for(let i=0;i<dates.length-1;i++){
    const cur = data.entries[dates[i]];
    const next = data.entries[dates[i+1]];
    if(cur.evening!=null && next.morning!=null && cur.evening!==next.morning){
      gaps.push({from:dates[i], to:dates[i+1], curEve:cur.evening, nextMorn:next.morning});
    }
  }
  return gaps;
}

function todayDistance(){
  return distanceForDate(todayISO());
}

function latestServiceOdo(){
  if(data.services.length===0) return 0;
  const sorted = [...data.services].sort((a,b)=> b.date.localeCompare(a.date) || b.odometer-a.odometer);
  return sorted[0].odometer;
}

function nextServiceOdo(){
  return latestServiceOdo() + data.settings.intervalKm;
}

function serviceProgress(){
  const cur = latestOdometer();
  const start = latestServiceOdo();
  const end = nextServiceOdo();
  const pct = Math.min(100, Math.max(0, ((cur-start)/(end-start))*100));
  return {pct, remaining: Math.max(0, end-cur)};
}

function mileageBetweenRefills(){
  const refills = [...data.refills].sort((a,b)=>a.odometer-b.odometer);
  const results = [];
  for(let i=1;i<refills.length;i++){
    const distKm = refills[i].odometer - refills[i-1].odometer;
    const liters = Number(refills[i-1].liters)||0;
    if(liters>0){
      results.push({date:refills[i-1].date, kmpl:(distKm/liters).toFixed(1), distKm, liters});
    }
  }
  return results;
}

// ---- Spending ----
function allSpendRecords(){
  const list = [];
  data.refills.forEach(r=> list.push({date:r.date, category:'Fuel', amount:Number(r.cost)||0, note:`${r.liters} L`}));
  data.services.forEach(s=> list.push({date:s.date, category:'Service', amount:Number(s.cost)||0, note:s.note||''}));
  data.expenses.forEach(e=> list.push({date:e.date, category:e.category, amount:Number(e.amount)||0, note:e.note||''}));
  return list;
}
function totalSpend(list){
  list = list || allSpendRecords();
  return list.reduce((a,b)=>a+Number(b.amount||0),0);
}
function spendInMonth(prefix){
  return totalSpend(allSpendRecords().filter(r=>r.date.startsWith(prefix)));
}
function categoryTotals(){
  const totals = {Fuel:0, Service:0};
  allSpendRecords().forEach(r=>{
    const key = (r.category==='Fuel'||r.category==='Service') ? r.category : 'Other';
    totals[key] = (totals[key]||0) + Number(r.amount||0);
  });
  return totals;
}
function costPerKm(){
  const dist = totalDistanceAll();
  const spend = totalSpend();
  return dist>0 ? spend/dist : 0;
}
function monthlySpendTable(){
  const map = {};
  allSpendRecords().forEach(r=>{
    const m = r.date.slice(0,7);
    map[m] = (map[m]||0) + Number(r.amount||0);
  });
  return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
}
function monthlySpendByCategory(){
  const map = {}; // month -> {Fuel, Service, Other}
  allSpendRecords().forEach(r=>{
    const m = r.date.slice(0,7);
    const key = (r.category==='Fuel'||r.category==='Service') ? r.category : 'Other';
    if(!map[m]) map[m] = {Fuel:0, Service:0, Other:0};
    map[m][key] += Number(r.amount||0);
  });
  const months = Object.keys(map).sort();
  return {months, map};
}

function odometerWheels(num){
  const str = String(Math.round(num));
  return `<div class="odo-row">${str.split('').map(d=>`<div class="odo-digit">${d}</div>`).join('')}</div>`;
}

function render(){
  const app = document.getElementById('app');
  const cur = latestOdometer();
  const tDist = todayDistance();
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const mStats = monthStats(monthPrefix);
  const svc = serviceProgress();
  const lastRefill = [...data.refills].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const gaps = findGaps();
  const lifetimeSpend = totalSpend();
  const monthSpend = spendInMonth(monthPrefix);
  const perKm = costPerKm();
  const rStats = rangeStats(rangeFrom, rangeTo);
  const rSpend = spendInRange(rangeFrom, rangeTo);
  const rLiters = litersInRange(rangeFrom, rangeTo);
  const rKmpl = rLiters > 0 ? (rStats.total / rLiters) : null;

  app.innerHTML = `
    <header>
      <h1>🏍️ Bike Log</h1>
      <p>Your bike, logged honestly — mileage and money, long term.</p>
    </header>

    <div class="cluster">
      ${odometerWheels(cur)}
      <div class="odo-label">Current Odometer (km)</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Today</div>
        <div class="value">${tDist!=null ? fmt(tDist)+' km' : '—'}</div>
        <div class="sub">${tDist!=null ? 'logged' : 'not logged yet'}</div>
      </div>
      <div class="stat-card">
        <div class="label">This Month</div>
        <div class="value">${fmt(mStats.total)} km</div>
        <div class="sub">${mStats.days} day${mStats.days!==1?'s':''} logged</div>
      </div>
      <div class="stat-card">
        <div class="label">Daily Avg</div>
        <div class="value">${mStats.avg.toFixed(1)}</div>
        <div class="sub">km/day this month</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card money">
        <div class="label">Total Spend</div>
        <div class="value">${fmtMoney(lifetimeSpend)}</div>
        <div class="sub">lifetime, all categories</div>
      </div>
      <div class="stat-card money">
        <div class="label">This Month</div>
        <div class="value">${fmtMoney(monthSpend)}</div>

    </div>` : ''}

    <div class="panel" style="border-color:var(--red);">
      <h2 style="color:var(--red);">⚠️ Untracked Gaps</h2>
      ${gaps.map(g=>`<div class="hint warn">${dLabel(g.from)} evening (${fmt(g.curEve)}) doesn't match ${dLabel(g.to)} morning (${fmt(g.nextMorn)}) — ${fmt(g.nextMorn-g.curEve)} km unlogged.</div>`).join('')}

    </div>

    <div id="tab-content"></div>
    <div class="footer-note">Data is stored privately to your account and persists across sessions.</div>
  `;

  renderTab();
  renderDistChart();

function setTab(t){ activeTab = t; render(); }

function renderTab(){
  const el = document.getElementById('tab-content');
  if(activeTab==='log') el.innerHTML = logTabHTML();
  else if(activeTab==='refuel') el.innerHTML = refuelTabHTML();
  else if(activeTab==='service') el.innerHTML = serviceTabHTML();
  else if(activeTab==='expenses') el.innerHTML = expensesTabHTML();
  else if(activeTab==='spending'){ el.innerHTML = spendingTabHTML(); renderSpendingCharts(); }
  else if(activeTab==='mileage'){ el.innerHTML = mileageTabHTML(); renderMileageChart(); }
  else if(activeTab==='export') el.innerHTML = exportTabHTML();
}

function renderDistChart(){
  destroyChart('dist-chart');
  const ctx = document.getElementById('dist-chart');
  if(!ctx || typeof Chart==='undefined') return;
  const dates = sortedDates().slice(-14);
  const labels = dates.map(d=>dLabel(d));
  const values = dates.map(d=> distanceForDate(d) ?? 0);
  charts['dist-chart'] = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[{label:'km', data:values, backgroundColor:'#F2A93C', borderRadius:4, maxBarThickness:28}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.y+' km'}}},
      scales:{
        x:{ticks:{color:'#8B9199', font:{size:10}}, grid:{display:false}},
        y:{ticks:{color:'#8B9199'}, grid:{color:'#2C3136'}, beginAtZero:true}
      }
    }
  });
}

function renderMileageChart(){
  destroyChart('mileage-chart');
  const ctx = document.getElementById('mileage-chart');
  if(!ctx || typeof Chart==='undefined') return;
  const results = mileageBetweenRefills();
  if(results.length===0) return;
  charts['mileage-chart'] = new Chart(ctx, {
    type:'line',
    data:{labels: results.map(r=>dLabel(r.date)), datasets:[{
      label:'km/l', data:results.map(r=>Number(r.kmpl)),
      borderColor:'#6FCF97', backgroundColor:'rgba(111,207,151,0.15)',
      fill:true, tension:0.3, pointBackgroundColor:'#6FCF97', pointRadius:4
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.y+' km/l'}}},
      scales:{
        x:{ticks:{color:'#8B9199', font:{size:10}}, grid:{display:false}},
        y:{ticks:{color:'#8B9199'}, grid:{color:'#2C3136'}}
      }
    }
  });
}

function renderSpendingCharts(){
  destroyChart('cat-chart');
  destroyChart('month-spend-chart');
  const catCtx = document.getElementById('cat-chart');
  if(catCtx && typeof Chart!=='undefined'){
    const cats = categoryTotals();
    const labels = Object.keys(cats).filter(k=>cats[k]>0);
    const values = labels.map(k=>cats[k]);
    charts['cat-chart'] = new Chart(catCtx, {
      type:'doughnut',
      data:{labels, datasets:[{
        data:values,
        backgroundColor:['#F2A93C','#6FCF97','#7EA6E0','#E4572E','#B191E0','#EDC94C','#E091C7','#8B9199'],
        borderColor:'#1C2024', borderWidth:2
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{position:'bottom', labels:{color:'#EDEDED', font:{size:11}, padding:12}},
          tooltip:{callbacks:{label:c=>c.label+': '+fmtMoney(c.parsed)}}}
      }
    });
  }
  const monthCtx = document.getElementById('month-spend-chart');
  if(monthCtx && typeof Chart!=='undefined'){
    const {months, map} = monthlySpendByCategory();
    const recent = months.slice(-12);
    charts['month-spend-chart'] = new Chart(monthCtx, {
      type:'bar',
      data:{
        labels: recent.map(monthLabel),
        datasets:[
          {label:'Fuel', data: recent.map(m=>map[m].Fuel), backgroundColor:'#F2A93C', borderRadius:3, maxBarThickness:36},
          {label:'Service', data: recent.map(m=>map[m].Service), backgroundColor:'#6FCF97', borderRadius:3, maxBarThickness:36},
          {label:'Other', data: recent.map(m=>map[m].Other), backgroundColor:'#7EA6E0', borderRadius:3, maxBarThickness:36}
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom', labels:{color:'#EDEDED', font:{size:11}, padding:12}},
          tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtMoney(c.parsed.y)}}
        },
        scales:{
          x:{stacked:true, ticks:{color:'#8B9199', font:{size:10}}, grid:{display:false}},
          y:{stacked:true, ticks:{color:'#8B9199'}, grid:{color:'#2C3136'}, beginAtZero:true}
        }
      }
    });
  }
}

function rideHistoryTableHTML(){
  const dates = sortedDates().sort().reverse();
  if(dates.length===0) return `<div class="empty">No rides logged yet.</div>`;
  return `
    <table>
      <tr><th>Date</th><th>Morning</th><th>Evening</th><th>Dist</th><th>Note</th><th></th></tr>
      ${dates.map(d=>{
        const e = data.entries[d];
        const dist = distanceForDate(d);
        return `<tr>
          <td>${dLabel(d)}</td>
          <td>${e.morning ?? '—'}</td>
          <td>${e.evening ?? '—'}</td>
          <td>${dist!=null ? dist+' km' : '<span class="gap-flag">missing</span>'}</td>

            <button class="icon-btn" onclick="deleteEntry('${d}')">✕</button>
          </td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

async function submitLog(){
  const iso = document.getElementById('log-date').value;
  const morning = document.getElementById('log-morning').value;
  const evening = document.getElementById('log-evening').value;
  if(!iso){ alert('Pick a date'); return; }
  const note = document.getElementById('log-note').value;
  data.entries[iso] = {
    morning: morning!=='' ? Number(morning) : (data.entries[iso]?.morning ?? null),
    evening: evening!=='' ? Number(evening) : (data.entries[iso]?.evening ?? null),
    note: note || undefined
  };
  await saveData();
  render();
  activeTab='log'; renderTab();
}

async function submitRefuel(){
  const date = document.getElementById('rf-date').value;
  const odo = Number(document.getElementById('rf-odo').value);
  const liters = Number(document.getElementById('rf-liters').value);
  const cost = Number(document.getElementById('rf-cost').value);
  const note = document.getElementById('rf-note').value;
  if(!date || !odo || !liters){ alert('Fill date, odometer and liters at least'); return; }
  if(editingRefuelId){
    const idx = data.refills.findIndex(r=>r.id===editingRefuelId);
    if(idx !== -1){
      data.refills[idx] = { ...data.refills[idx], date, odometer:odo, liters, cost, note: note || undefined };
    }
    editingRefuelId = null;
  } else {
    data.refills.push({id:'r'+Date.now(), date, liters, cost, odometer:odo, note: note || undefined});
  }
  await saveData();
  render();
  activeTab='refuel'; renderTab();
}

async function deleteRefuel(id){
  data.refills = data.refills.filter(r=>r.id!==id);
  if(editingRefuelId === id) editingRefuelId = null;
  await saveData();
  render();
  activeTab='refuel'; renderTab();
}

async function submitService(){
  const date = document.getElementById('svc-date').value;
  const odo = Number(document.getElementById('svc-odo').value);
  const cost = Number(document.getElementById('svc-cost').value) || 0;
  const note = document.getElementById('svc-note').value;
  if(!date || !odo){ alert('Enter date and odometer'); return; }
  const curOdo = latestOdometer();
  const lowOdoWarning = odo < curOdo;
  if(editingServiceId){
    const idx = data.services.findIndex(s=>s.id===editingServiceId);
    if(idx !== -1){
      data.services[idx] = { ...data.services[idx], date, odometer:odo, cost, note };
    }
    editingServiceId = null;
  } else {
    data.services.push({id:'svc'+Date.now(), date, odometer:odo, cost, note});
  }
  await saveData();
  render();
  activeTab='service'; renderTab();
  if(lowOdoWarning){
    alert(`Saved. Note: ${fmt(odo)} km is lower than your bike's current odometer (${fmt(curOdo)} km) — double-check this isn't a typo.`);
  }
}

async function submitInterval(){
  const interval = Number(document.getElementById('svc-interval').value);
  if(!interval){ alert('Enter a valid interval'); return; }
  data.settings.intervalKm = interval;
  await saveData();
  render();
  activeTab='service'; renderTab();
}

        <td class="row-actions">
          <button class="icon-btn" onclick="editExpense('${e.id}')">✎</button>
          <button class="icon-btn" onclick="deleteExpense('${e.id}')">✕</button>
        </td>
      </tr>`).join('')}
  </table>`;
}

function editExpense(id){
  editingExpenseId = id;
  renderTab();
}

function cancelEditExpense(){
  editingExpenseId = null;
  renderTab();
}

async function submitExpense(){
  const date = document.getElementById('ex-date').value;
  const category = document.getElementById('ex-category').value;
  const amount = Number(document.getElementById('ex-amount').value);
  const note = document.getElementById('ex-note').value;
  if(!date || !amount){ alert('Enter date and amount'); return; }
  if(editingExpenseId){
    const idx = data.expenses.findIndex(e=>e.id===editingExpenseId);
    if(idx !== -1){
      data.expenses[idx] = { ...data.expenses[idx], date, category, amount, note };
    }
    editingExpenseId = null;
  } else {
    data.expenses.push({id:'ex'+Date.now(), date, category, amount, note});
  }
  await saveData();
  render();
  activeTab='expenses'; renderTab();
}

async function deleteExpense(id){
  data.expenses = data.expenses.filter(e=>e.id!==id);
  if(editingExpenseId === id) editingExpenseId = null;
  await saveData();
  render();
  activeTab='expenses'; renderTab();
}

// ---- Spending overview ----
function spendingTabHTML(){

  const max = Math.max(...Object.values(cats), 1);
  const {months, map} = monthlySpendByCategory();
  const monthlyRows = [...months].reverse();
  const dist = totalDistanceAll();

  return `
    <div class="panel">
      <div class="big-stat">
        <div class="value">${fmtMoney(totalSpend())}</div>
        <div class="label">Total Spent — Lifetime</div>
      </div>
      <div class="hint" style="text-align:center;">Across ${fmt(dist)} km ridden — that's ₹${costPerKm().toFixed(2)} per km.</div>

    <div class="panel">
      <h2>📊 By Category</h2>
      <div class="chart-box"><canvas id="cat-chart"></canvas></div>
      <div style="margin-top:16px;">
        ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
          <div class="bar-row">
            <div class="bar-head"><span class="cat">${cat}</span><span class="amt">${fmtMoney(amt)}</span></div>

      </div>
    </div>

    <div class="panel">
      <h2>📅 Monthly Spend</h2>
      <div class="chart-box"><canvas id="month-spend-chart"></canvas></div>
      ${monthlyRows.length===0 ? `<div class="empty">No spending logged yet.</div>` : `
      <table style="margin-top:14px;">
        <tr><th>Month</th><th>Fuel</th><th>Service</th><th>Other</th><th>Total</th></tr>
        ${monthlyRows.map(m=>{
          const row = map[m];
          const total = row.Fuel + row.Service + row.Other;
          return `<tr>
            <td>${monthLabel(m)}</td>
            <td>${fmtMoney(row.Fuel)}</td>

            <td>${fmtMoney(row.Other)}</td>

}

async function deleteEntry(iso){
  delete data.entries[iso];
  await saveData();

  activeTab='log'; renderTab();
}

// ---- Backup ----
function exportTabHTML(){
  return `
    <div class="panel">
      <h2>💾 Backup Your Data</h2>
      <div class="hint">Your log lives in Claude's storage for this artifact. Download a copy to your device so you always have it, independent of this chat.</div>
      <div class="export-row" style="margin-top:14px;">
        <button class="btn" onclick="exportJSON()">Download Full Backup (JSON)</button>
        <button class="btn secondary" onclick="exportRidesCSV()">Download Rides (CSV)</button>
        <button class="btn secondary" onclick="exportRefuelsCSV()">Download Refuels (CSV)</button>
        <button class="btn secondary" onclick="exportSpendingCSV()">Download Spending (CSV)</button>
      </div>
    </div>
    <div class="panel">
      <h2>♻️ Restore From Backup</h2>
      <div class="hint">Upload a previously downloaded JSON backup to restore your data. This replaces everything currently stored here.</div>
      <div class="field full" style="margin-top:10px;">
        <input type="file" id="restore-file" accept="application/json">
      </div>
      <button class="btn danger" onclick="restoreJSON()">Restore &amp; Overwrite</button>
    </div>
  `;
}

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportJSON(){
  downloadBlob(JSON.stringify(data, null, 2), `bike-log-backup-${todayISO()}.json`, 'application/json');
}

function exportRidesCSV(){
  const rows = [['Date','Morning','Evening','Distance(km)']];
  sortedDates().forEach(d=>{
    const e = data.entries[d];
    const dist = distanceForDate(d);
    rows.push([d, e.morning ?? '', e.evening ?? '', dist ?? '']);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  downloadBlob(csv, `bike-rides-${todayISO()}.csv`, 'text/csv');
}

function exportRefuelsCSV(){
  const rows = [['Date','Liters','Cost(INR)','Odometer(km)','INR/Liter']];
  [...data.refills].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    rows.push([r.date, r.liters, r.cost, r.odometer, (r.cost/r.liters).toFixed(2)]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  downloadBlob(csv, `bike-refuels-${todayISO()}.csv`, 'text/csv');
}

function exportSpendingCSV(){
  const rows = [['Date','Category','Amount(INR)','Note']];
  [...allSpendRecords()].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    rows.push([r.date, r.category, r.amount, (r.note||'').replace(/,/g,';')]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  downloadBlob(csv, `bike-spending-${todayISO()}.csv`, 'text/csv');
}

async function restoreJSON(){
  const fileInput = document.getElementById('restore-file');
  const file = fileInput.files[0];
  if(!file){ alert('Choose a JSON backup file first'); return; }
  try{
    const text = await file.text();
    let parsed = JSON.parse(text);
    if(!parsed.entries || !parsed.refills){
      alert("This file doesn't look like a valid backup.");
      return;
    }
    parsed = migrate(parsed);
    if(!confirm('This will overwrite all current data with the backup. Continue?')) return;
    data = parsed;
    await saveData();
    render();
    activeTab='export'; renderTab();
    alert('Restored successfully.');
  }catch(e){
    alert("Could not read that file. Make sure it's a JSON backup downloaded from this tracker.");
  }
}

loadData();
